# Everything runs in Docker; nothing is installed on the machine.
#   docker compose build
#   docker compose run --rm android ./gradlew testDebugUnitTest assembleDebug
#   docker compose run --rm android sh bump-version.sh minor
#   docker compose run --rm android ./gradlew testDebugUnitTest publishApk
services:
  android:
    build: .
    image: telugu-calendar-build
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/gradle-cache      # keeps downloaded dependencies between runs
      - android-sdk:/opt/android-sdk    # SDK packages Gradle installs on demand persist here
    environment:
      - GRADLE_OPTS=-Dorg.gradle.daemon=false -Xmx3g
      - ADMOB_APP_ID           # passed through from your shell if set (or put them in secrets.properties)
      - ADMOB_BANNER_UNIT_ID
volumes:
  gradle-cache:
  android-sdk:
